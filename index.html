<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KB Coaching</title>
  
  <!-- Nome dell'app quando viene aggiunta alla Home del telefono -->
  <meta name="apple-mobile-web-app-title" content="KB Coaching">
  <meta name="application-name" content="KB Coaching">
  
  <!-- Icone per il logo KB -->
  <link rel="apple-touch-icon" href="kevinlogo.jpg">
  <link rel="icon" type="image/jpeg" href="kevinlogo.jpg">

  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181c24;
      --accent-color: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2a313d;
      --success-color: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      padding-bottom: 80px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }
    header img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }
    header h1 {
      font-size: 1.2rem;
      margin: 0;
      color: var(--text-main);
    }
    header h2 {
      font-size: 0.95rem;
      margin: 2px 0 0 0;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Selettore dei Giorni */
    .days-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 4px;
    }
    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .day-btn.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: var(--text-muted);
    }
    .error { color: #ef4444; }
    
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .exercise-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 4px 0;
    }
    .exercise-notes {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    
    .set-row {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .set-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--accent-color);
    }
    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .input-group input, .input-group textarea {
      width: 100%;
      background: #111318;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .full-width {
      grid-column: span 2;
    }
    
    .save-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 17, 21, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      text-align: center;
      z-index: 100;
    }
    .save-btn {
      background-color: var(--success-color);
      color: white;
      border: none;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .save-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <img src="kevinlogo.jpg" alt="Logo KB">
    <div>
      <h1>Kevin Beraldo Coaching</h1>
      <h2 id="client-title">Caricamento...</h2>
    </div>
  </header>

  <!-- Contenitore dei bottoni per cambiare giorno -->
  <div id="days-nav" class="days-container" style="display: none;"></div>

  <div id="app" class="loading">Caricamento scheda in corso...</div>

  <div class="save-container" id="save-bar" style="display: none;">
    <button class="save-btn" onclick="salvaModifiche()">Salva Modifiche</button>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwt4EJ6y2EKxTH41m77Ng0kGDQTbbF8Rcl81rmHutHqS9laEPn-QmncUPFzflTfQKJX/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id');

    if (!clientId) {
      document.getElementById('app').innerHTML = '<div class="error">Nessun utente specificato nell\'URL (es. ?id=Loris)</div>';
      document.getElementById('client-title').innerText = "Errore";
    } else {
      document.getElementById('client-title').innerText = clientId;
      caricaScheda();
    }

    let rawDataCache = [];
    let currentDay = "";

    function caricaScheda() {
      fetch(`${WEB_APP_URL}?id=${encodeURIComponent(clientId)}`)
        .then(response => response.json())
        .then(data => {
          if (!data || data.length === 0) {
            document.getElementById('app').innerHTML = '<div class="error">Nessuna scheda trovata per questo utente.</div>';
            return;
          }
          rawDataCache = data;
          
          // Estrai i giorni unici presenti nel foglio (es. "Giorno 1", "Giorno 2", ecc.)
          const days = [...new Set(data.map(row => row.giorno || row.Giorno || "Allenamento").filter(Boolean))];
          
          if (days.length > 0) {
            currentDay = days[0]; // Di default seleziona il primo giorno
            renderDaysNav(days);
          }

          renderApp();
          document.getElementById('save-bar').style.display = 'block';
        })
        .catch(error => {
          console.error("Errore:", error);
          document.getElementById('app').innerHTML = '<div class="error">Errore di connessione al database.</div>';
        });
    }

    function renderDaysNav(days) {
      const nav = document.getElementById('days-nav');
      nav.style.display = 'flex';
      nav.innerHTML = '';

      days.forEach(day => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${day === currentDay ? 'active' : ''}`;
        btn.innerText = day;
        btn.onclick = () => {
          currentDay = day;
          document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderApp();
        };
        nav.appendChild(btn);
      });
    }

    function renderApp() {
      const app = document.getElementById('app');
      app.className = "";
      app.innerHTML = "";

      // Filtra i dati solo per il giorno attualmente selezionato
      const filteredData = rawDataCache.filter(row => {
        const rowDay = row.giorno || row.Giorno || "Allenamento";
        return rowDay === currentDay;
      });

      if (filteredData.length === 0) {
        app.innerHTML = '<div class="error">Nessun esercizio trovato per questo giorno.</div>';
        return;
      }

      // Raggruppa per esercizio
      const exercises = {};
      filteredData.forEach(row => {
        const esName = row.esercizio || row.Esercizio || "Esercizio senza nome";
        if (!exercises[esName]) {
          exercises[esName] = {
            noteTecniche: row["note tecniche"] || row["Note Tecniche"] || "",
            sets: []
          };
        }
        exercises[esName].sets.push(row);
      });

      for (let [esName, details] of Object.entries(exercises)) {
        let card = document.createElement('div');
        card.className = 'exercise-card';
        
        let html = `
          <div class="exercise-title">${esName}</div>
          <div class="exercise-notes">Note: ${details.noteTecniche}</div>
        `;

        details.sets.forEach((setRow, index) => {
          const setNum = setRow.serie || setRow.Serie || (index + 1);
          const targetReps = setRow.ripetizioni || setRow.Ripetizioni || "-";
          const savedKg = setRow.kg !== undefined && setRow.kg !== null ? setRow.kg : "";
          const savedReps = setRow["ripetizioni effettuate"] !== undefined && setRow["ripetizioni effettuate"] !== null ? setRow["ripetizioni effettuate"] : "";
          const savedNote = setRow["note cliente"] !== undefined && setRow["note cliente"] !== null ? setRow["note cliente"] : "";

          html += `
            <div class="set-row" data-esercizio="${esName}" data-set="${setNum}">
              <div class="set-header">
                <span>Set ${setNum}</span>
                <span>Target: ${targetReps} reps</span>
              </div>
              <div class="inputs-grid">
                <div class="input-group">
                  <label>KG Usati</label>
                  <input type="number" step="0.5" class="input-kg" value="${savedKg}" placeholder="0">
                </div>
                <div class="input-group">
                  <label>Reps Fatte</label>
                  <input type="text" class="input-reps" value="${savedReps}" placeholder="-">
                </div>
                <div class="input-group full-width">
                  <label>Note Cliente</label>
                  <textarea class="input-note" rows="1" placeholder="Es. Facile, un po' di fastidio...">${savedNote}</textarea>
                </div>
              </div>
            </div>
          `;
        });

        card.innerHTML = html;
        app.appendChild(card);
      }
    }

    function salvaModifiche() {
      const rowsToUpdate = [];
      const setRows = document.querySelectorAll('.set-row');

      setRows.forEach(row => {
        const esercizio = row.getAttribute('data-esercizio');
        const setNum = row.getAttribute('data-set');
        const kg = row.querySelector('.input-kg').value;
        const repsEffettuate = row.querySelector('.input-reps').value;
        const noteCliente = row.querySelector('.input-note').value;

        rowsToUpdate.push({
          cliente: clientId,
          giorno: currentDay,
          esercizio: esercizio,
          set: setNum,
          kg: kg,
          repsEffettuate: repsEffettuate,
          noteCliente: noteCliente
        });
      });

      const btn = document.querySelector('.save-btn');
      btn.innerText = "Salvataggio in corso...";

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(rowsToUpdate)
      })
      .then(() => {
        btn.innerText = "Salvato con successo! ✓";
        setTimeout(() => {
          btn.innerText = "Salva Modifiche";
        }, 2500);
      })
      .catch(error => {
        console.error("Errore salvataggio:", error);
        btn.innerText = "Errore nel salvataggio";
        setTimeout(() => {
          btn.innerText = "Salva Modifiche";
        }, 2500);
      });
    }
  </script>
</body>
</html>
