<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheda Allenamento - Kevin Beraldo</title>
    
    <!-- Tag per il logo KB -->
    <link rel="apple-touch-icon" href="kevinlogo.jpg">
    <link rel="icon" type="image/jpeg" href="kevinlogo.jpg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import "tailwindcss";
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header con il tuo logo KB -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <img src="kevinlogo.jpg" alt="Logo KB" class="w-10 h-10 rounded-full object-cover border border-gray-700 shadow">
            <div>
                <h1 id="client-title" class="font-bold text-lg tracking-wide text-white">Caricamento Scheda...</h1>
                <p class="text-xs text-gray-400">PT Kevin Beraldo</p>
            </div>
        </div>
        <div id="client-badge" class="hidden px-3 py-1 bg-blue-600/20 border border-blue-500/30 text-blue-400 text-xs font-semibold rounded-full">
            Attivo
        </div>
    </header>

    <!-- Contenuto principale -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">
        <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-3">
            <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-400 text-sm">Caricamento dati allenamento...</p>
        </div>

        <div id="content" class="space-y-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        <p>© 2026 Kevin Beraldo Coaching. Tutti i diritti riservati.</p>
    </footer>

    <!-- Script di logica -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cliente = urlParams.get('id');

        if (!cliente) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('client-title').innerText = "Errore Accesso";
            document.getElementById('content').innerHTML = `
                <div class="bg-red-950/40 border border-red-800 p-6 rounded-xl text-center space-y-2">
                    <p class="text-red-400 font-semibold">Nessun cliente specificato.</p>
                    <p class="text-xs text-gray-400">Usa il link personale fornito dal tuo personal trainer.</p>
                </div>
            `;
        } else {
            document.getElementById('client-title').innerText = `Scheda di ${cliente.toUpperCase()}`;

            const scriptURL = `https://script.google.com/macros/s/AKfycbwt4EJ6y2EKxTH41m77Ng0kGDQTbbF8Rcl81rmHutHqS9laEPn-QmncUPFzflTfQKJX/exec?id=${encodeURIComponent(cliente)}`;

            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('client-badge').classList.remove('hidden');
                    
                    if (!data || data.length === 0) {
                        document.getElementById('content').innerHTML = `
                            <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl text-center">
                                <p class="text-gray-400">Nessun esercizio trovato per questo profilo.</p>
                            </div>
                        `;
                        return;
                    }

                    let htmlContent = '';
                    data.forEach(item => {
                        htmlContent += `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-sm space-y-3">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-base text-blue-400">${item.Esercizio || 'Esercizio'}</h3>
                                    <span class="text-xs bg-gray-800 text-gray-300 px-2.5 py-1 rounded-md">${item.Gruppi_muscolari || ''}</span>
                                </div>
                                <div class="grid grid-cols-3 gap-2 text-sm bg-gray-950/60 p-3 rounded-lg border border-gray-800/60 text-center">
                                    <div>
                                        <span class="block text-[10px] uppercase text-gray-500 font-medium">Serie</span>
                                        <span class="font-semibold text-gray-200">${item.Serie || '-'}</span>
                                    </div>
                                    <div>
                                        <span class="block text-[10px] uppercase text-gray-500 font-medium">Ripetizioni</span>
                                        <span class="font-semibold text-gray-200">${item.Ripetizioni || '-'}</span>
                                    </div>
                                    <div>
                                        <span class="block text-[10px] uppercase text-gray-500 font-medium">Recupero</span>
                                        <span class="font-semibold text-gray-200">${item.Recupero || '-'}</span>
                                    </div>
                                </div>
                                ${item.Note_Tecniche ? `<p class="text-xs text-gray-400 italic bg-gray-950/30 p-2 rounded">Note: ${item.Note_Tecniche}</p>` : ''}
                            </div>
                        `;
                    });

                    document.getElementById('content').innerHTML = htmlContent;
                })
                .catch(error => {
                    console.error('Errore:', error);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').innerHTML = `
                        <div class="bg-red-950/40 border border-red-800 p-6 rounded-xl text-center space-y-2">
                            <p class="text-red-400 font-semibold">Errore di connessione al database.</p>
                            <p class="text-xs text-gray-400">Riprova più tardi o contatta il supporto.</p>
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
