<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PT Kevin Beraldo</title>
  
  <!-- Icona per iOS quando salvata sulla schermata Home -->
  <link rel="apple-touch-icon" href="kevinlogo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #21262d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px 16px 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* Logo & Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 10px;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 16px;
      filter: drop-shadow(0 4px 12px rgba(37, 99, 235, 0.25));
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
      margin: 0;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--accent-light);
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Card Esercizio */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .exercise-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .muscle-badge {
      background-color: rgba(37, 99, 235, 0.15);
      color: var(--accent-light);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-light);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .notes {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.4;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header con Logo KB -->
    <div class="header">
      <img src="kevinlogo.png" onerror="this.onerror=null; this.src='kevinlogo.jpg';" alt="Logo PT Kevin Beraldo" class="logo">
      <h1 class="brand-title">Kevin Beraldo</h1>
      <div class="brand-subtitle">Personal Trainer</div>
    </div>

    <!-- Anteprima Card Esercizio -->
    <div class="card">
      <div class="card-header">
        <h2 class="exercise-title">Panca Piana Bilanciere</h2>
        <span class="muscle-badge">Petto</span>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-value">4</span>
          <span class="stat-label">Serie</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">8</span>
          <span class="stat-label">Reps</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">90"</span>
          <span class="stat-label">Rest</span>
        </div>
      </div>
      <div class="notes">Fermo al petto di 1 secondo. Esecuzione controllata nella fase eccentrica.</div>
    </div>
  </div>

</body>
</html>
