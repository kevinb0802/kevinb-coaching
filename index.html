<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PT Kevin Beraldo</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="kevinlogo.jpg">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="kevinlogo.jpg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --danger: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1.brand-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        #client-name {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .exercise-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .exercise-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .set-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .set-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        .input-wrapper label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        input[type="number"], input[type="text"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            text-align: center;
            font-size: 1rem;
        }

        input[type="text"] {
            text-align: left;
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .btn-save {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-save:active {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-title">Kevin Beraldo</h1>
        <div id="client-name">Caricamento in corso...</div>
    </header>

    <div id="app">
        <div id="loading">Connessione al database in corso...</div>
    </div>

    <script>
        // INCOLLA QUI L'URL DELLA TUA WEB APP DI GOOGLE APPS SCRIPT
        const API_URL = 'https://script.google.com/macros/s/AKfycbz9S8qlsZ210ifoD_tCyfaEaHEMQ1iTm8eVOf5vqFzgjgcPp-x2MRFvw_MZ1oWr_W_A/exec';

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const clientQuery = urlParams.get('id') || urlParams.get('cliente') || '';
            
            if (!clientQuery) {
                document.getElementById('client-name').innerText = "Errore";
                document.getElementById('app').innerHTML = '<div class="card" style="text-align:center;">Nessun utente specificato nell\'URL (es. ?id=Amore).</div>';
                return;
            }

            document.getElementById('client-name').innerText = clientQuery.charAt(0).toUpperCase() + clientQuery.slice(1);

            try {
                const response = await fetch(`${API_URL}?id=${encodeURIComponent(clientQuery)}`);
                const clientData = await response.json();

                const appDiv = document.getElementById('app');
                if (!clientData || clientData.length === 0) {
                    appDiv.innerHTML = '<div class="card" style="text-align:center;">Nessuna scheda trovata per questo utente.</div>';
                    return;
                }

                const exercises = {};
                clientData.forEach(row => {
                    let exName = row.esercizio || 'Esercizio';
                    if (!exercises[exName]) exercises[exName] = [];
                    exercises[exName].push(row);
                });

                let html = '';
                for (let exName in exercises) {
                    let firstRow = exercises[exName][0];
                    let noteTech = firstRow['note tecniche'] || '';
                    
                    html += `<div class="card">
                        <div class="exercise-title">${exName}</div>`;
                    if (noteTech) {
                        html += `<div class="exercise-subtitle">Note: ${noteTech}</div>`;
                    }
                    
                    exercises[exName].forEach((item) => {
                        let numeroSerie = item.serie !== undefined ? item.serie : '-';
                        let targetReps = item.ripetizioni !== undefined ? item.ripetizioni : '-';
                        let caricoKg = item.kg !== undefined && item.kg !== null ? item.kg : '';
                        let repsEffettuate = item['ripetizioni effettuate'] !== undefined && item['ripetizioni effettuate'] !== null ? item['ripetizioni effettuate'] : '';
                        let noteCliente = item['note cliente'] !== undefined && item['note cliente'] !== null ? item['note cliente'] : '';

                        html += `
                            <div class="set-row">
                                <div class="set-header">
                                    <span>Set ${numeroSerie}</span>
                                    <span>Target: ${targetReps} reps</span>
                                </div>
                                <div class="inputs-grid">
                                    <div class="input-wrapper">
                                        <label>KG Usati</label>
                                        <input type="number" value="${caricoKg}" data-ex="${exName}" data-set="${numeroSerie}" class="input-kg" placeholder="0">
                                    </div>
                                    <div class="input-wrapper">
                                        <label>Reps Fatte</label>
                                        <input type="number" value="${repsEffettuate}" data-ex="${exName}" data-set="${numeroSerie}" class="input-reps" placeholder="-">
                                    </div>
                                </div>
                                <div class="input-wrapper" style="margin-top: 6px;">
                                    <label>Note Cliente</label>
                                    <input type="text" value="${noteCliente}" data-ex="${exName}" data-set="${numeroSerie}" class="input-note" placeholder="Es. Facile, un po' di fastidio...">
                                </div>
                            </div>`;
                    });
                    html += `</div>`;
                }

                html += `<button class="btn-save" onclick="saveData('${clientQuery}')">Salva Modifiche</button>`;
                appDiv.innerHTML = html;

            } catch (error) {
                document.getElementById('app').innerHTML = '<div class="card" style="text-align:center; color: var(--danger);">Errore di connessione al database. Riprova più tardi.</div>';
            }
        }

        async function saveData(clientName) {
            const setRows = document.querySelectorAll('.set-row');
            let updatedData = [];

            setRows.forEach(row => {
                const kgInput = row.querySelector('.input-kg');
                const repsInput = row.querySelector('.input-reps');
                const noteInput = row.querySelector('.input-note');

                updatedData.push({
                    cliente: clientName,
                    esercizio: kgInput.getAttribute('data-ex'),
                    set: kgInput.getAttribute('data-set'),
                    kg: kgInput.value,
                    repsEffettuate: repsInput.value,
                    noteCliente: noteInput.value
                });
            });

            const btn = document.querySelector('.btn-save');
            btn.innerText = "Salvataggio in corso...";

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                alert("Modifiche salvate e inviate al coach con successo!");
            } catch (err) {
                alert("Errore durante il salvataggio.");
            } finally {
                btn.innerText = "Salva Modifiche";
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
