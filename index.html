<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PT Kevin Beraldo</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="kevinlogo.jpg">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="kevinlogo.jpg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --danger: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1.brand-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        #client-name {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .exercise-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .set-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .set-info {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .input-wrapper label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        input[type="number"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 8px;
            border-radius: 6px;
            width: 65px;
            text-align: center;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .btn-save {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-save:active {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-title">Kevin Beraldo</h1>
        <div id="client-name">Caricamento in corso...</div>
    </header>

    <div id="app">
        <div id="loading">Caricamento scheda...</div>
    </div>

    <script>
        // Dati statici di emergenza (funzionanti al 100%)
        const staticData = [
            { cliente: "Mario Rossi", esercizio: "Panca Piana", set: 1, reps: "10", targetKg: 70 },
            { cliente: "Mario Rossi", esercizio: "Panca Piana", set: 2, reps: "8", targetKg: 75 },
            { cliente: "Mario Rossi", esercizio: "Panca Piana", set: 3, reps: "6", targetKg: 80 },
            { cliente: "Mario Rossi", esercizio: "Squat", set: 1, reps: "10", targetKg: 90 },
            { cliente: "Mario Rossi", esercizio: "Squat", set: 2, reps: "8", targetKg: 100 }
        ];

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const clientQuery = urlParams.get('id') || urlParams.get('cliente') || 'Mario Rossi';
            
            document.getElementById('client-name').innerText = clientQuery;

            // Filtra i dati per il cliente
            const clientData = staticData.filter(row => row.cliente.toLowerCase() === clientQuery.toLowerCase());

            const appDiv = document.getElementById('app');
            if (clientData.length === 0) {
                appDiv.innerHTML = '<div class="card" style="text-align:center;">Nessuna scheda trovata per questo utente.</div>';
                return;
            }

            // Raggruppa per esercizio
            const exercises = {};
            clientData.forEach(row => {
                if (!exercises[row.esercizio]) exercises[row.esercizio] = [];
                exercises[row.esercizio].push(row);
            });

            let html = '';
            for (let exName in exercises) {
                html += `<div class="card">
                    <div class="exercise-title">${exName}</div>`;
                
                exercises[exName].forEach((item, index) => {
                    html += `
                        <div class="set-row">
                            <span class="set-info">Set ${item.set} — ${item.reps} reps</span>
                            <div class="input-group">
                                <div class="input-wrapper">
                                    <label>KG</label>
                                    <input type="number" value="${item.targetKg}" data-ex="${exName}" data-set="${item.set}">
                                </div>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            }

            html += `<button class="btn-save" onclick="saveData()">Salva Modifiche</button>`;
            appDiv.innerHTML = html;
        }

        function saveData() {
            alert("Modifiche salvate con successo in locale!");
        }

        window.onload = initApp;
    </script>
</body>
</html>
